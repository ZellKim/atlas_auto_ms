# ============================================================
# atlas-auto 연구 설계 프로토콜 (Study Protocol)
# ============================================================
#
# 이 파일 하나로 전체 파이프라인이 자동 실행됩니다:
#   코호트 JSON 생성 → ATLAS 업로드 → Generate → Estimation 실행 → 결과 다운로드
#
# 사용법:
#   from atlas_auto import StudyProtocol
#   protocol = StudyProtocol.from_yaml("my_study.yaml")
#   protocol.run(config_path="config.yaml")
#
# 또는 CLI:
#   atlas-auto protocol --study my_study.yaml --config config.yaml
# ============================================================

# ── 연구 메타데이터 ──
study:
  name: "Appendectomy vs Cholecystectomy CES"
  description: "충수절제술 vs 담낭절제술의 임상 결과 비교"
  type: "ComparativeEffectStudy"      # ComparativeEffectStudy | CohortCharacterization
  author: "홍길동"
  version: "1.0"

# ============================================================
# 코호트 정의
# ============================================================
# 각 코호트는 자동으로 ATLAS CIRCE JSON으로 변환됩니다.
#
# domain 종류:
#   condition  - ConditionOccurrence (진단)
#   procedure  - ProcedureOccurrence (시술/수술)
#   drug       - DrugExposure (약물)
#   visit      - VisitOccurrence (방문)
#   measurement - Measurement (검사)
#
# concept 지정 방법:
#   1) concept_id 직접 지정 (가장 정확)
#   2) concept_name + vocabulary 지정 (패키지가 검색)
#   3) concept_code + vocabulary 지정
#
# ============================================================

cohorts:

  # ── Target 코호트 ──
  target:
    name: "Appendectomy (충수절제술)"
    domain: procedure
    concepts:
      - concept_id: 4198190
        concept_name: "Appendectomy"  # 참고용 (concept_id가 우선)
        include_descendants: true
    observation_window:
      prior_days: 365               # 인덱스 전 최소 관찰 기간
      post_days: 0
    inclusion_rules:
      - name: "age >= 18"
        type: demographic
        age: {op: gte, value: 18}
      - name: "동시 대수술 제외"
        type: exclusion
        domain: procedure
        concepts:
          - concept_id: 4301351     # Major abdominal surgery
            include_descendants: true
        window: {start: 0, end: 0}  # 같은 날
        restrict_visit: true        # 같은 방문
      - name: "이전 충수염 수술 제외"
        type: exclusion
        domain: condition
        concepts:
          - concept_id: 440448      # Appendicitis
            include_descendants: true
        window: {start: -365, end: -1}  # 1년 이내 이전

  # ── Comparator 코호트 ──
  comparator:
    name: "Cholecystectomy (담낭절제술)"
    domain: procedure
    concepts:
      - concept_id: 4239323
        concept_name: "Cholecystectomy"
        include_descendants: true
    observation_window:
      prior_days: 365
      post_days: 0
    inclusion_rules:
      - name: "age >= 18"
        type: demographic
        age: {op: gte, value: 18}

  # ── Outcome 코호트 ──
  outcomes:
    - name: "Ulcerative colitis (궤양성 대장염)"
      domain: condition
      concepts:
        - concept_id: 81893
          concept_name: "Ulcerative colitis"
          include_descendants: true

    - name: "Crohn's disease (크론병)"
      domain: condition
      concepts:
        - concept_id: 201606
          concept_name: "Crohn's disease"
          include_descendants: true

    - name: "AMI (급성심근경색)"
      domain: condition
      concepts:
        - concept_id: 4329847
          concept_name: "Myocardial infarction"
          include_descendants: true
      visit_type: inpatient          # inpatient, outpatient, er (선택)

    - name: "Type 2 DM (제2형 당뇨)"
      domain: condition
      concepts:
        - concept_id: 201826
          concept_name: "Type 2 diabetes mellitus"
          include_descendants: true
      inclusion_rules:
        - name: "혈당 확인"
          type: measurement
          concepts:
            - concept_id: 3004410   # Glucose
              include_descendants: true
          value: {op: gte, value: 126}
          window: {start: -30, end: 30}

# ============================================================
# 분석 설정 (Estimation)
# ============================================================

analysis:

  # ── TCO (Target-Comparator-Outcomes) ──
  # target/comparator는 위의 cohorts에서 자동 매핑
  # outcomes는 위에서 정의한 모든 outcome 사용 (또는 아래서 선택)

  # ── CohortMethod 분석 설정 ──
  methods:
    - id: 1
      description: "PS stratification (5 strata), Cox"
      ps_method: stratify          # stratify | match | iptw | trim | none
      ps_strata: 5
      model: cox                   # cox | logistic | poisson
      stratified_cox: true
      risk_window:
        start: 1                   # 인덱스 후 1일부터
        end: 0                     # 노출 종료 시까지
        add_exposure_days: true    # end에 노출 기간 더하기
      remove_prior_outcome: true
      restrict_to_common_period: true

    - id: 2
      description: "PS 1:1 matching, Cox"
      ps_method: match
      match_ratio: 1
      match_caliper: 0.2
      model: cox
      stratified_cox: true
      risk_window:
        start: 1
        end: 0
        add_exposure_days: true
      remove_prior_outcome: true

# ============================================================
# 실행 설정
# ============================================================

execution:
  # config.yaml 경로 (portal 인증, DB 접속 정보)
  config: "config.yaml"

  # 실행 범위
  sites: "remote_only"             # all | local_only | remote_only

  # 결과 저장
  output_dir: "./output"

  # 자동 다운로드
  auto_download: true
